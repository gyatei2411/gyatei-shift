<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>今週のシフト - ぎゃあてい</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="shared.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      background: #0F172A;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    /* ===== 画面全体 ===== */
    .screen { height: 100%; display: flex; flex-direction: column; }

    /* 上部バー: 情報は小さく */
    .topbar {
      flex: 0 0 auto;
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      padding: 6px 14px;
      color: #94A3B8; font-size: 12px;
    }
    .topbar .week {
      color: #F8FAFC; font-size: 22px; font-weight: 800; letter-spacing: 0.02em;
    }
    .topbar .stamp { color: #64748B; }
    .topbar .spacer { flex: 1; }
    .topbar button {
      background: #1E293B; color: #94A3B8; border: 1px solid #334155;
      border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
      font-family: inherit;
    }
    .topbar button:disabled { opacity: 0.3; cursor: default; }
    .badge-draft {
      background: #B45309; color: #FFF7ED; padding: 3px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 800;
    }

    /* 表を画面いっぱいに拡大する領域 */
    .fit-wrap { flex: 1 1 auto; position: relative; overflow: hidden; }
    .fit-inner { position: absolute; top: 0; left: 0; transform-origin: top left; }
    /* スマホ横向き: 横は1週間ぶん、縦はスクロール（文字を小さくしすぎない） */
    .fit-wrap.scrolly { overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* ===== シフト表 ===== */
    table.board { border-collapse: separate; border-spacing: 3px; }
    table.board th, table.board td { text-align: center; vertical-align: middle; }

    /* 曜日ヘッダ */
    th.day {
      background: #1E293B; color: #CBD5E1; border-radius: 8px;
      padding: 6px 10px; min-width: 118px;
    }
    th.day .d-date { font-size: 22px; font-weight: 800; line-height: 1.1; }
    th.day .d-dow { font-size: 15px; font-weight: 700; opacity: 0.8; }
    th.day.sat .d-dow { color: #60A5FA; }
    th.day.sun .d-dow { color: #F87171; }
    th.day.hol .d-dow { color: #FCA5A5; }
    th.day.hol .d-date { color: #FECACA; }
    th.day.today { background: #4338CA; color: #fff; box-shadow: 0 0 0 3px #818CF8; }
    th.day.closed { background: #172033; color: #475569; }

    th.corner { background: transparent; }

    /* 名前 */
    td.name {
      background: #1E293B; color: #F1F5F9; border-radius: 8px;
      font-size: 24px; font-weight: 800;
      text-align: left; padding: 4px 14px; white-space: nowrap;
      min-width: 130px;
    }

    /* 勤務セル */
    td.cell { border-radius: 8px; padding: 4px 6px; min-width: 118px; height: 62px; }
    td.cell.off { background: #131C2E; }
    td.cell.closedday { background: #0B1220; }
    td.cell .ci { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    td.cell .pos {
      font-size: 30px; font-weight: 900; line-height: 1.05; letter-spacing: 0.02em;
      white-space: nowrap;
    }
    /* 2部（16時〜L）の部分は 1部より小さく */
    td.cell .pos .p2 { font-size: 20px; font-weight: 800; opacity: 0.9; letter-spacing: 0; }
    .board.compact td.cell .pos .p2 { font-size: 17px; }
    td.cell .time {
      font-size: 20px; font-weight: 800; line-height: 1.15;
    }
    /* 0部（9:00〜9:30 朝の準備）。ポジションの左に 1部より小さく出す */
    td.cell .sub {
      font-size: 18px; font-weight: 800; vertical-align: 3px; margin-right: 6px;
      background: rgba(255,255,255,0.20); border: 1px solid rgba(255,255,255,0.30);
      border-radius: 6px; padding: 0 6px; letter-spacing: 0;
    }
    .board.compact td.cell .sub { font-size: 15px; padding: 0 4px; margin-right: 4px; }

    /* 出勤していないが「出られる」と答えた日 */
    td.cell.av-o { background: #123024; color: #4ADE80; }
    td.cell.av-t { background: #2E2410; color: #FBBF24; }
    td.cell.av-m { background: #241C36; color: #C4B5FD; }
    td.cell .mark { font-size: 24px; font-weight: 900; line-height: 1; }

    /* 今週シフトが1日もない人（表の下に小さくまとめる） */
    .resting {
      flex: 0 0 auto;
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      padding: 6px 14px 0; font-size: 14px; color: #64748B; line-height: 1.6;
    }
    .resting .rt-label { font-weight: 800; color: #94A3B8; white-space: nowrap; }
    .resting .rt-person {
      background: #16202F; border-radius: 6px; padding: 2px 9px; white-space: nowrap;
      color: #CBD5E1; font-weight: 700;
    }
    .resting .rt-person .rt-day { font-weight: 800; margin-left: 5px; }
    .resting .rt-person .rt-o { color: #4ADE80; }
    .resting .rt-person .rt-t { color: #FBBF24; }
    .resting .rt-person .rt-m { color: #C4B5FD; }
    .resting .rt-none { opacity: 0.55; }

    /* 下段の情報行（休み・まかない・メモ） */
    tr.info td.name { font-size: 17px; padding: 2px 12px; background: #16202F; color: #94A3B8; }
    tr.info td.v {
      background: #131C2E; color: #CBD5E1; border-radius: 6px;
      height: 34px; padding: 2px 6px; font-size: 17px; font-weight: 700;
      white-space: normal; line-height: 1.2;
    }
    tr.info.fam td.name { background: #2A2110; color: #FCD34D; }
    tr.info.fam td.v { background: #241D0E; color: #FCD34D; }
    tr.info.mkn td.name { background: #10251B; color: #6EE7B7; }
    tr.info.mkn td.v { background: #0E2318; color: #6EE7B7; font-size: 26px; font-weight: 900; }
    tr.info td.v.blank { color: #475569; font-weight: 500; }
    tr.info td.closedday { background: #0B1220; }

    /* 人数が多い週は1行にまとめて、その分だけ文字を大きく見せる */
    table.board.compact td.cell { height: 42px; }
    table.board.compact td.cell .ci { flex-direction: row; align-items: baseline; gap: 8px; }
    table.board.compact td.name { font-size: 21px; padding: 2px 12px; }
    table.board.compact th.day { padding: 3px 8px; }

    /* ポジション別の色分け */
    .p-K   { background: #7F1D1D; color: #FEE2E2; }
    .p-R2  { background: #1E3A8A; color: #DBEAFE; }
    .p-R2d { background: #1E40AF; color: #DBEAFE; }
    .p-R1  { background: #334155; color: #E2E8F0; }
    .p-W   { background: #14532D; color: #DCFCE7; }
    .p-T   { background: #581C87; color: #F3E8FF; }
    .p-etc { background: #334155; color: #E2E8F0; }

    /* 凡例（小さく） */
    .legend {
      flex: 0 0 auto;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 5px 14px 8px; font-size: 12px; color: #64748B;
    }
    .legend i {
      display: inline-block; padding: 2px 8px; border-radius: 5px;
      font-style: normal; font-weight: 800; margin-right: 3px;
    }

    /* 直近の修正（表の下に1〜2行だけ） */
    .lastfix {
      flex: 0 0 auto;
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      padding: 5px 14px 0; font-size: 13px; color: #94A3B8; line-height: 1.5;
      max-height: 44px; overflow: hidden;
    }
    .lastfix .lf-label {
      background: #7C2D12; color: #FED7AA; font-weight: 800;
      padding: 2px 9px; border-radius: 6px; white-space: nowrap;
    }
    .lastfix .lf-item { color: #CBD5E1; white-space: nowrap; }
    .lastfix .lf-more { color: #64748B; }

    /* 変更履歴のオーバーレイ */
    .hist-back {
      position: fixed; inset: 0; background: rgba(2,6,23,0.86); z-index: 500;
      display: none; align-items: center; justify-content: center; padding: 24px;
    }
    .hist-back.open { display: flex; }
    .hist-box {
      background: #0F172A; border: 1px solid #334155; border-radius: 14px;
      max-width: 900px; width: 100%; max-height: 88vh; display: flex; flex-direction: column;
    }
    .hist-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 20px; border-bottom: 1px solid #1E293B;
    }
    .hist-head h2 { color: #F8FAFC; font-size: 20px; font-weight: 800; }
    .hist-head .sub { color: #64748B; font-size: 13px; font-weight: 500; margin-top: 2px; }
    .hist-head button {
      background: #1E293B; color: #E2E8F0; border: 1px solid #334155;
      border-radius: 8px; padding: 8px 18px; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .hist-body { overflow-y: auto; padding: 14px 20px 20px; -webkit-overflow-scrolling: touch; }
    .hist-ver {
      border: 1px solid #1E293B; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
      background: #131C2E;
    }
    .hist-ver.latest { border-color: #166534; background: #10251B; }
    .hist-ver .v {
      font-size: 16px; font-weight: 800; color: #F1F5F9; margin-bottom: 6px;
    }
    .hist-ver .v .when { font-weight: 600; color: #64748B; font-size: 13px; margin-left: 10px; }
    .hist-ver .v .now { color: #4ADE80; font-size: 13px; margin-left: 8px; }
    .hist-ver ul { list-style: none; }
    .hist-ver li {
      font-size: 15px; color: #CBD5E1; line-height: 1.75;
      padding-left: 14px; position: relative;
    }
    .hist-ver li::before { content: '・'; position: absolute; left: 0; color: #475569; }

    /* ===== スマホ用：1日ずつの一覧（見るだけ） ===== */
    .bv-wrap { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 10px 24px; }
    .bv-days { display: flex; gap: 5px; padding: 4px 0 10px; position: sticky; top: 0; background: #0F172A; z-index: 3; }
    .bv-days button {
      flex: 1 1 0; min-width: 0; padding: 8px 2px; border-radius: 10px;
      border: 1.5px solid #334155; background: #131C2E; color: #94A3B8;
      font-family: inherit; font-size: 12px; font-weight: 700; line-height: 1.3; cursor: pointer;
      white-space: nowrap;
    }
    .bv-days button .d { display: block; font-size: 15px; font-weight: 800; color: #E2E8F0; }
    .bv-days button.on { background: #4338CA; border-color: #818CF8; color: #fff; }
    .bv-days button.on .d { color: #fff; }
    .bv-days button.closed { background: #0B1220; color: #475569; }
    .bv-days button.closed .d { color: #475569; }
    .bv-days button.today { box-shadow: 0 0 0 2px #818CF8; }
    .bv-days button.hol { color: #FCA5A5; }
    .bv-days button.hol .d { color: #FECACA; }
    .bv-days button.on.hol, .bv-days button.on.hol .d { color: #fff; }

    .bv-count { color: #64748B; font-size: 13px; font-weight: 700; margin: 2px 2px 8px; }
    .bv-list { display: flex; flex-direction: column; gap: 5px; }
    .bv-row {
      display: flex; align-items: center; gap: 8px;
      border-radius: 10px; padding: 9px 12px; min-height: 50px;
      background: #131C2E;
    }
    .bv-row .bv-name { flex: 0 0 84px; font-size: 17px; font-weight: 800; color: #F1F5F9; }
    .bv-row .bv-pos { flex: 1; font-size: 22px; font-weight: 900; white-space: nowrap; }
    .bv-row .bv-pos .p0 {
      font-size: 13px; font-weight: 800; vertical-align: 2px; margin-right: 5px;
      background: rgba(255,255,255,0.20); border: 1px solid rgba(255,255,255,0.30);
      border-radius: 5px; padding: 0 5px;
    }
    .bv-row .bv-pos .p2 { font-size: 15px; font-weight: 800; opacity: 0.9; }
    .bv-row .bv-time { flex: 0 0 auto; font-size: 17px; font-weight: 800; }
    .bv-row.av { background: #101A2E; }
    .bv-row.av .bv-name { color: #94A3B8; font-weight: 700; font-size: 15px; }
    .bv-row.av .bv-mark { font-size: 17px; font-weight: 900; }
    .bv-sec { color: #64748B; font-size: 12px; font-weight: 800; margin: 14px 2px 6px; }
    .bv-info { margin-top: 12px; display: flex; flex-direction: column; gap: 5px; }
    .bv-irow { display: flex; gap: 10px; align-items: center; background: #131C2E; border-radius: 10px; padding: 9px 12px; }
    .bv-irow .l { flex: 0 0 74px; font-size: 12px; font-weight: 800; color: #94A3B8; }
    .bv-irow .v { flex: 1; font-size: 16px; font-weight: 700; color: #E2E8F0; }
    .bv-irow.fam .l, .bv-irow.fam .v { color: #FCD34D; }
    .bv-irow.mkn .l, .bv-irow.mkn .v { color: #6EE7B7; }
    .bv-irow.mkn .v { font-size: 22px; font-weight: 900; }

    /* 記号の説明は普段は出さない（「❔ 記号」で開く） */
    .legend { display: none !important; }

    /* 記号の見方・オーバーレイ */
    .leg-back {
      position: fixed; inset: 0; background: rgba(2,6,23,0.88); z-index: 500;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .leg-back.open { display: flex; }
    .leg-box {
      background: #0F172A; border: 1px solid #334155; border-radius: 14px;
      max-width: 720px; width: 100%; max-height: 88vh; display: flex; flex-direction: column;
    }
    .leg-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid #1E293B;
    }
    .leg-head h2 { color: #F8FAFC; font-size: 19px; font-weight: 800; }
    .leg-head button {
      background: #1E293B; color: #E2E8F0; border: 1px solid #334155;
      border-radius: 8px; padding: 8px 16px; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .leg-body { overflow-y: auto; padding: 14px 18px 20px; -webkit-overflow-scrolling: touch; }
    .leg-sec { margin-bottom: 16px; }
    .leg-sec h3 { color: #94A3B8; font-size: 13px; font-weight: 800; margin-bottom: 8px; }
    .leg-items { display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .leg-item { display: flex; align-items: center; gap: 7px; color: #CBD5E1; font-size: 15px; line-height: 1.5; }
    .leg-item i {
      font-style: normal; font-weight: 900; font-size: 16px;
      border-radius: 6px; padding: 3px 10px; min-width: 34px; text-align: center;
    }
    .leg-note { color: #94A3B8; font-size: 14px; line-height: 1.7; }
    .leg-note b { color: #E2E8F0; }


    /* ===== 細い画面（スマホ縦向き） =====
       縦には余裕があっても**横幅**で縮尺が決まるので、
       名前列・余白・2部の表記を細くして表全体の幅を縮めると文字が大きくなる */
    @media (max-width: 700px) {
      .topbar { padding: 4px 10px; gap: 6px 8px; font-size: 11px; }
      .topbar .week { font-size: 17px; }
      .topbar .stamp { font-size: 10px; }
      .topbar button { padding: 4px 9px; font-size: 11px; border-radius: 6px; }
      .topbar .spacer { display: none; }
      .topbar .lbl { display: none; }   /* アイコン・日付だけにして1行に収める */
      .topbar button { padding: 4px 8px; font-size: 14px; line-height: 1.1; }
      .topbar .stamp { flex: 1 1 100%; order: 9; margin-top: -2px; }
      .badge-draft { font-size: 10px; padding: 2px 7px; }
      .lastfix { display: none; }          /* 内容は「📜 変更履歴」から見られる */
      .resting { font-size: 11px; padding: 4px 8px 0; line-height: 1.5; gap: 5px; }
      .resting .rt-person { padding: 1px 6px; }

      table.board, table.board.compact { border-spacing: 1px; }
      table.board td.name, table.board.compact td.name {
        min-width: 52px; font-size: 21px; padding: 1px 5px; border-radius: 5px;
      }
      table.board th.day, table.board.compact th.day {
        min-width: 0; padding: 2px 3px; border-radius: 5px;
      }
      table.board th.day .d-date { font-size: 14px; line-height: 1.1; }
      table.board th.day .d-dow { font-size: 10px; }
      table.board td.cell, table.board.compact td.cell {
        min-width: 0; height: auto; padding: 2px 3px; border-radius: 5px;
      }
      table.board td.cell .ci, table.board.compact td.cell .ci {
        flex-direction: column; align-items: center; gap: 0;
      }
      table.board td.cell .pos, table.board.compact td.cell .pos { font-size: 30px; }
      /* 2部と 0部 はぐっと小さく＝セルの幅が縮まる＝全体が大きく見える */
      table.board td.cell .pos .p2, table.board.compact td.cell .pos .p2 { font-size: 13px; }
      table.board td.cell .sub, table.board.compact td.cell .sub {
        font-size: 12px; padding: 0 3px; margin-right: 3px; vertical-align: 2px;
      }
      table.board td.cell .time, table.board.compact td.cell .time { font-size: 20px; }
      table.board td.cell .mark { font-size: 20px; }
      table.board tr.info td.name { font-size: 11px; padding: 1px 5px; }
      table.board tr.info td.v { height: 22px; font-size: 15px; padding: 1px 3px; }
      table.board tr.info.mkn td.v { font-size: 18px; }
    }

    /* 背の低い画面（スマホ横向き）は上下をとにかく詰める */
    @media (max-height: 500px) {
      .topbar { padding: 3px 10px; gap: 8px; font-size: 11px; }
      .topbar .week { font-size: 15px; }
      .topbar .stamp { display: none; }
      .topbar button { padding: 3px 8px; font-size: 11px; }
      .badge-draft { font-size: 11px; padding: 2px 8px; }
      .lastfix { display: none; }
      .resting { font-size: 12px; padding: 3px 10px 0; line-height: 1.4; max-height: 42px; overflow: hidden; }
      .resting .rt-person { padding: 1px 7px; }

      /* 表を縦に詰める。文字は大きいままなので、全体を入れても小さくなりすぎない
         ※ compact より強い選択子にしておくこと */
      table.board, table.board.compact { border-spacing: 1px; }
      table.board th.day, table.board.compact th.day { padding: 1px 6px; min-width: 100px; }
      table.board th.day .d-date { font-size: 16px; line-height: 1.05; }
      table.board th.day .d-dow { font-size: 11px; }
      table.board td.name, table.board.compact td.name { font-size: 17px; padding: 0 8px; min-width: 92px; }
      table.board td.cell, table.board.compact td.cell { height: 26px; padding: 0 5px; min-width: 100px; }
      table.board td.cell .ci, table.board.compact td.cell .ci {
        flex-direction: row; align-items: baseline; gap: 7px;
      }
      table.board td.cell .pos, table.board.compact td.cell .pos { font-size: 24px; }
      table.board td.cell .time, table.board.compact td.cell .time { font-size: 16px; }
      table.board td.cell .sub, table.board.compact td.cell .sub { font-size: 13px; padding: 0 4px; margin-right: 3px; }
      table.board td.cell .pos .p2, table.board.compact td.cell .pos .p2 { font-size: 15px; }
      table.board td.cell .mark { font-size: 18px; }
      table.board tr.info td.name { font-size: 13px; padding: 0 8px; }
      table.board tr.info td.v { height: 22px; font-size: 14px; padding: 0 5px; }
      table.board tr.info.mkn td.v { font-size: 18px; }
    }

    .msg {
      color: #94A3B8; text-align: center; padding: 60px 20px; font-size: 20px; line-height: 1.9;
    }
    .msg strong { color: #F1F5F9; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <span class="week" id="week-label">読み込み中…</span>
      <span class="badge-draft" id="draft-badge" style="display:none">未確定（下書き）</span>
      <span class="stamp" id="stamp"></span>
      <span class="spacer"></span>
      <button id="btn-prev" onclick="moveWeek(-1)" title="前の週">◀<span class="lbl"> 前の週</span></button>
      <button id="btn-next" onclick="moveWeek(1)" title="次の週"><span class="lbl">次の週 </span>▶</button>
      <button id="btn-hist" onclick="openHistory()" style="display:none" title="変更履歴">📜<span class="lbl"> 変更履歴</span><span class="cnt"></span></button>
      <button onclick="openLegend()" title="記号の見方">❔<span class="lbl"> 記号</span></button>
      <button id="btn-bvmode" onclick="toggleBoardMode()" title="1日ずつ / 1週間"></button>
      <button onclick="App.forceUpdate ? App.forceUpdate() : location.reload()" title="最新に更新">🔄<span class="lbl"> 更新</span></button>
    </div>

    <div class="fit-wrap" id="fit-wrap">
      <div class="fit-inner" id="fit-inner"></div>
    </div>
    <div class="bv-wrap" id="bv-wrap" style="display:none"></div>

    <div class="lastfix" id="lastfix" style="display:none"></div>
    <div class="resting" id="resting" style="display:none"></div>
    <div class="legend" id="legend"></div>
  </div>

  <!-- 記号の見方 -->
  <div class="leg-back" id="leg-back" onclick="if(event.target===this) closeLegend()">
    <div class="leg-box">
      <div class="leg-head">
        <h2>❔ 記号の見方</h2>
        <button onclick="closeLegend()">閉じる</button>
      </div>
      <div class="leg-body" id="leg-body"></div>
    </div>
  </div>

  <div class="hist-back" id="hist-back" onclick="if(event.target===this) closeHistory()">
    <div class="hist-box">
      <div class="hist-head">
        <div>
          <h2>📜 変更履歴</h2>
          <div class="sub" id="hist-sub"></div>
        </div>
        <button onclick="closeHistory()">閉じる</button>
      </div>
      <div class="hist-body" id="hist-body"></div>
    </div>
  </div>

  <script>
    const POS_CLASS = { K: 'p-K', R2: 'p-R2', R2d: 'p-R2d', R1: 'p-R1', W: 'p-W', T: 'p-T' };
    let reqIds = [];      // 表示対象の依頼ID（週の古い順）
    let fbError = false;  // Firebaseの読み取り権限エラー
    let cursor = 0;       // reqIds 内の現在位置

    function init() {
      App.initFirebase();
      if (App.isOnline()) {
        App.subscribeSettings(() => {});
        App.subscribeRequests(
          () => { fbError = false; pickWeeks(); render(); },
          () => { fbError = true; render(); }
        );
      }
      pickWeeks();
      render();
      window.addEventListener('resize', fit);
      // タブレット放置対策: 5分ごとに再描画（日付またぎ・同期漏れ対策）
      setInterval(() => { pickWeeks(); render(); }, 5 * 60 * 1000);
    }

    // 表示できる週を集める（確定済みを優先。無ければ全依頼）
    function pickWeeks() {
      const prevId = reqIds[cursor];
      const every = App.getRequests().slice().sort((a, b) => a.ws < b.ws ? -1 : 1);
      // 終わった週（日曜日を過ぎた週）はタブレットには出さない
      const today = App.todayLocal();
      let all = every.filter(r => !App.isPastWeek(r.ws, today));
      if (!all.length) all = every.slice(-1);   // 全部過去なら一番新しい週だけ残す
      const confirmed = all.filter(r => App.getConfirmed(r.id));
      let list = confirmed.length ? confirmed : all;

      const urlId = new URLSearchParams(location.search).get('id');
      // URLで週を指定されたときは、未確定でもその週を見られるようにする
      if (urlId && !list.some(r => r.id === urlId) && every.some(r => r.id === urlId)) {
        list = every.filter(r => !App.isPastWeek(r.ws, today) || r.id === urlId);
      }
      reqIds = list.map(r => r.id);
      let idx = -1;
      if (urlId && reqIds.includes(urlId)) idx = reqIds.indexOf(urlId);
      else if (prevId && reqIds.includes(prevId)) idx = reqIds.indexOf(prevId);
      else {
        // 今日を含む週 → 無ければ一番新しい週
        const today = App.toDateStr ? App.toDateStr(new Date()) : null;
        const thisWs = App.weekStart();
        idx = reqIds.findIndex(id => (App.getRequest(id) || {}).ws === thisWs);
        if (idx < 0) idx = reqIds.length - 1;
      }
      cursor = Math.max(0, idx);
    }

    function moveWeek(step) {
      const next = cursor + step;
      if (next < 0 || next >= reqIds.length) return;
      cursor = next;
      // URL固定を解除してから描画
      history.replaceState(null, '', location.pathname);
      render();
    }

    function fmtStamp(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      const p2 = n => String(n).padStart(2, '0');
      return `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    /* ===== 変更履歴 ===== */

    function renderHistory(req, conf) {
      const btn = document.getElementById('btn-hist');
      const lf = document.getElementById('lastfix');
      const hist = (conf && conf.history) ? conf.history : [];
      // 修正が1回もなければ履歴は出さない（初回確定の日時は上部に出ている）
      if (hist.length <= 1) {
        btn.style.display = 'none';
        lf.style.display = 'none'; lf.innerHTML = '';
        closeHistory();
        return;
      }
      btn.style.display = '';
      btn.innerHTML = `📜<span class="lbl"> 変更履歴</span>(${hist.length - 1})`;

      // 表の下に「直近の修正」を短く出す（初回確定だけなら出さない）
      const last = hist[hist.length - 1];
      if (hist.length > 1 && last && (last.changes || []).length) {
        const items = last.changes.slice(0, 2).map(c => `<span class="lf-item">${esc(c)}</span>`).join('');
        const rest = last.changes.length > 2
          ? `<span class="lf-more">ほか${last.changes.length - 2}件（変更履歴をタップ）</span>` : '';
        lf.innerHTML = `<span class="lf-label">🔄 ${fmtStamp(last.at)} の修正</span>${items}${rest}`;
        lf.style.display = '';
      } else {
        lf.style.display = 'none'; lf.innerHTML = '';
      }

      document.getElementById('hist-sub').textContent =
        `${App.weekLabel(req.ws)}　確定${hist.length}回（うち修正${hist.length - 1}回）`;
      document.getElementById('hist-body').innerHTML = hist.slice().reverse().map(h => `
        <div class="hist-ver ${h.v === conf.version ? 'latest' : ''}">
          <div class="v">v${h.v}<span class="when">${fmtStamp(h.at)}</span>${h.v === conf.version ? '<span class="now">← 今表示している内容</span>' : ''}</div>
          <ul>${(h.changes || []).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
        </div>
      `).join('');
    }

    function openHistory() {
      const el = document.getElementById('hist-back');
      if (document.getElementById('btn-hist').style.display === 'none') return;
      el.classList.add('open');
    }
    function closeHistory() { document.getElementById('hist-back').classList.remove('open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHistory(); });

    function showMsg(html) {
      document.getElementById('fit-inner').innerHTML = `<div class="msg">${html}</div>`;
      document.getElementById('fit-inner').style.transform = 'scale(1)';
      document.getElementById('legend').innerHTML = '';
      const r = document.getElementById('resting');
      if (r) { r.innerHTML = ''; r.style.display = 'none'; }
      const lf = document.getElementById('lastfix');
      if (lf) { lf.innerHTML = ''; lf.style.display = 'none'; }
      const hb = document.getElementById('btn-hist');
      if (hb) hb.style.display = 'none';
      closeHistory();
    }

    function render() {
      document.getElementById('btn-prev').disabled = cursor <= 0;
      document.getElementById('btn-next').disabled = cursor >= reqIds.length - 1;

      const reqId = reqIds[cursor];
      const req = reqId ? App.getRequest(reqId) : null;
      if (!req && fbError) {
        document.getElementById('week-label').textContent = '表示できません';
        document.getElementById('stamp').textContent = '';
        showMsg('Firebaseの<strong>読み取り権限がありません</strong>。<br>' +
          'Firebaseコンソール → Realtime Database → ルールで<br>' +
          '<strong>requests に “.read”: true を追加</strong>して公開してください。<br>' +
          '<span style="font-size:15px;color:#64748B">（詳しくは README.md の「Firebase 設定」を参照）</span>');
        return;
      }
      if (!req) {
        document.getElementById('week-label').textContent = 'シフトがまだありません';
        document.getElementById('stamp').textContent = '';
        showMsg('確定されたシフトがまだありません。<br>管理画面でシフトを作成し、<strong>「シフトを確定」</strong>を押してください。');
        return;
      }

      const conf = App.getConfirmed(reqId);
      const cells = conf ? (conf.cells || {}) : App.getManual(reqId);
      const closed = new Set(req.closed || []);
      const dates = App.weekDates(req.ws);
      const todayStr = new Date().toISOString().slice(0, 10);

      // 狭い画面では曜日を省いて 1行に収める
      document.getElementById('week-label').innerHTML =
        `${App.fmtMD(dates[0])}<span class="lbl">(${App.DOW_LABELS[0]})</span>` +
        `〜${App.fmtMD(dates[6])}<span class="lbl">(${App.DOW_LABELS[6]})</span>`;
      document.getElementById('draft-badge').style.display = conf ? 'none' : '';
      document.getElementById('stamp').textContent = conf
        ? `確定 v${conf.version}・${fmtStamp(conf.at)}${(conf.history || []).length > 1 ? `（修正${conf.history.length - 1}回）` : ''}`
        : '管理画面で確定するとスタッフ向けの正式版になります';

      renderHistory(req, conf);

      const get = (name, d, f) => cells[App._safeCellKey(`s_${name}_${d}_${f}`)] || '';
      const worksOn = (n, d) => !!(get(n, d, 'main') || get(n, d, 'start') || get(n, d, 'end'));

      // 出勤可否（○△✕）: 確定時のスナップショット優先、無ければ手元の回答
      const availMap = {};
      const availSrc = (conf && conf.avail) ? conf.avail
        : App.getReplies(reqId).map(r => ({ n: r.name, d: r.d }));
      (availSrc || []).forEach(a => { if (a && a.n) availMap[a.n] = a.d || ''; });
      // 回答データがないときは、シフト表に直接入力された ○△✕未 を使う
      //（紙のシフト表から転記した週は回答がないため）
      const symOf = (n, d) => {
        const s = (availMap[n] || '')[d];
        if (s) return s;
        const c = get(n, d, 'sym');
        return c === '○' ? 'o' : c === '△' ? 't' : c === '未' ? 'm'
             : (c === '✕' || c === '×') ? 'x' : '';
      };

      const all = (req.staff || []).slice();
      const working = all.filter(n => { for (let d = 0; d < 7; d++) if (!closed.has(d) && worksOn(n, d)) return true; return false; });
      const resting = all.filter(n => working.indexOf(n) < 0);

      if (!working.length && !resting.length) {
        showMsg('この週は<strong>スタッフが登録されていません</strong>。');
        return;
      }
      if (!working.length) {
        showMsg('この週はまだ<strong>ポジションが割り当てられていません</strong>。<br>管理画面のシフト表で割り当ててから確定してください。');
        return;
      }
      const names = working;

      let html = `<table class="board${working.length > 12 ? ' compact' : ''}"><thead><tr><th class="corner"></th>`;
      dates.forEach((ds, i) => {
        let cls = 'day';
        if (i === 5) cls += ' sat';
        if (i === 6) cls += ' sun';
        if (App.holidayName(ds)) cls += ' hol';
        if (closed.has(i)) cls += ' closed';
        if (ds === todayStr) cls += ' today';
        html += `<th class="${cls}">
          <div class="d-date">${App.fmtMD(ds)}</div>
          <div class="d-dow">${App.DOW_LABELS[i]}${App.holidayName(ds) ? '・祝' : ''}${closed.has(i) ? '・定休' : ''}</div>
        </th>`;
      });
      html += '</tr></thead><tbody>';

      const usedPos = {};
      let usedAvail = false;
      let used0 = false;
      let used2 = false;

      const rowFor = (name) => {
        let r = `<tr><td class="name">${esc(name)}</td>`;
        for (let d = 0; d < 7; d++) {
          if (closed.has(d)) { r += '<td class="cell closedday"></td>'; continue; }
          const pos = get(name, d, 'main');
          const sub = get(name, d, 'sub');
          if (sub) used0 = true;
          if (String(pos).indexOf('→') >= 0) used2 = true;
          const time = (get(name, d, 'start') + get(name, d, 'end')).trim();
          if (pos || time) {
            // 「R2→W」のような 1部→2部 表記は 1部のポジションで色を決める
            const seg = String(pos).split('→');
            const part1 = seg[0];                         // 1部（大きく）
            const part2 = seg.slice(1).join('→');        // 2部（小さく）
            const head = part1.replace(/[（(）)]/g, '').trim();
            const cls = POS_CLASS[head] || 'p-etc';
            if (head && POS_CLASS[head]) usedPos[head] = cls;
            r += `<td class="cell ${cls}"><div class="ci">` +
              (pos ? `<span class="pos">` +
                (sub ? `<span class="sub">${esc(sub)}</span>` : '') +
                esc(part1) +
                (part2 ? `<span class="p2">→${esc(part2)}</span>` : '') +
                `</span>` : '') +
              (time ? `<span class="time">${esc(time)}</span>` : '') +
              `</div></td>`;
            continue;
          }
          // 出勤していない日 → ○/△で出せると答えていれば交代候補として表示
          const sym = symOf(name, d);
          if (sym === 'o' || sym === 't' || sym === 'm') {
            usedAvail = true;
            const mk = sym === 'o' ? '○' : sym === 't' ? '△' : '未';
            r += `<td class="cell av-${sym}"><div class="ci"><span class="mark">${mk}</span></div></td>`;
          } else {
            r += '<td class="cell off"></td>';
          }
        }
        return r + '</tr>';
      };

      for (const name of names) html += rowFor(name);

      // 休み（家族）/ まかない / メモ
      const cell = (k) => cells[App._safeCellKey(k)] || '';
      const worksCount = (d) => names.filter(n => worksOn(n, d)).length;
      const infoRow = (cls, label, fn) => {
        let r = `<tr class="info ${cls}"><td class="name">${label}</td>`;
        for (let d = 0; d < 7; d++) {
          if (closed.has(d)) { r += '<td class="cell closedday"></td>'; continue; }
          const v = fn(d);
          r += `<td class="v${v ? '' : ' blank'}">${v || '・'}</td>`;
        }
        return r + '</tr>';
      };
      const anyFam = [0,1,2,3,4,5,6].some(d => !closed.has(d) && cell(`fam_off_${d}`));
      const anyMemo = [0,1,2,3,4,5,6].some(d => !closed.has(d) && cell(`memo_${d}`));
      if (anyFam) html += infoRow('fam', '休み', d => esc(cell(`fam_off_${d}`)));
      html += infoRow('mkn', 'まかない', d => {
        return String(worksCount(d) + App.FAMILY.length - App.familyOffCount(cell(`fam_off_${d}`)));
      });
      if (anyMemo) html += infoRow('', 'メモ', d => esc(cell(`memo_${d}`)));

      html += '</tbody></table>';

      // 今週シフトなしの人は、表の下に小さくまとめて出す（在籍していることが分かるように）
      const restEl = document.getElementById('resting');
      if (resting.length) {
        const chips = resting.map(n => {
          const days = [];
          for (let d = 0; d < 7; d++) {
            if (closed.has(d)) continue;
            const sm = symOf(n, d);
            if (sm === 'o' || sm === 't' || sm === 'm') {
              usedAvail = true;
              const mk = sm === 'o' ? '○' : sm === 't' ? '△' : '未';
              days.push(`<span class="rt-day rt-${sm}">${App.DOW_LABELS[d]}${mk}</span>`);
            }
          }
          return `<span class="rt-person${days.length ? '' : ' rt-none'}">${esc(n)}${days.join('')}</span>`;
        }).join('');
        restEl.innerHTML = `<span class="rt-label">今週シフトなし（${resting.length}名）</span>${chips}`;
        restEl.style.display = '';
      } else {
        restEl.innerHTML = '';
        restEl.style.display = 'none';
      }

      document.getElementById('fit-inner').innerHTML = html;

      // スマホ（狭い画面）は 1日ずつの一覧で見せる
      const bvw = document.getElementById('bv-wrap');
      const bvOn = (bvMode === 'day');
      document.getElementById('fit-wrap').style.display = bvOn ? 'none' : '';
      bvw.style.display = bvOn ? '' : 'none';
      if (bvOn) bvw.innerHTML = buildBoardDay(req, dates, closed, names, resting, todayStr, get, worksOn, symOf, cells);
      updateBoardModeBtn();

      buildLegend(usedPos, usedAvail, used0, used2);

      fit();
    }


    /* ===== スマホ用：1日ずつの一覧（見るだけ・編集不可） ===== */
    const BV_NARROW = 700;
    let bvMode = 'week';   // 縦向きでもまずは1週間を見せる
    let bvManual = false;
    let bvDay = null;

    function toggleBoardMode() {
      bvMode = (bvMode === 'day') ? 'week' : 'day';
      bvManual = true;
      render();
    }

    function updateBoardModeBtn() {
      const b = document.getElementById('btn-bvmode');
      if (!b) return;
      b.innerHTML = (bvMode === 'day')
        ? '\uD83D\uDCC5<span class="lbl"> 1週間</span>'
        : '\uD83D\uDCF1<span class="lbl"> 1日ずつ</span>';
    }

    function setBvDay(d) { bvDay = d; render(); }

    function buildBoardDay(req, dates, closed, names, resting, todayStr, get, worksOn, symOf, cells) {
      const open = [0,1,2,3,4,5,6].filter(i => !closed.has(i));
      const todayIdx = dates.indexOf(todayStr);
      if (bvDay === null) bvDay = (todayIdx >= 0 && !closed.has(todayIdx)) ? todayIdx : (open.length ? open[0] : 0);
      if (closed.has(bvDay)) bvDay = open.length ? open[0] : 0;
      const d = bvDay;

      let h = '<div class="bv-days">';
      dates.forEach((ds, i) => {
        const hd = App.holidayName(ds);
        const cls = [i === d ? 'on' : '', closed.has(i) ? 'closed' : '', ds === todayStr ? 'today' : '', hd ? 'hol' : ''].join(' ');
        h += `<button class="${cls}" title="${hd}" onclick="setBvDay(${i})">` +
             `<span class="d">${App.fmtMD(ds)}</span>${App.DOW_LABELS[i]}${hd ? '祝' : ''}${closed.has(i) ? '休' : ''}</button>`;
      });
      h += '</div>';

      if (closed.has(d)) return h + '<div class="msg">定休日です</div>';

      const working = names.filter(n => worksOn(n, d));
      const avail = names.concat(resting).filter(n => !worksOn(n, d))
        .filter(n => ['o','t','m'].indexOf(symOf(n, d)) >= 0);

      const rowFor = (n) => {
        const pos = get(n, d, 'main'), sub = get(n, d, 'sub');
        const seg = String(pos).split('→');
        const head = seg[0].replace(/[（(）)]/g, '').trim();
        const cls = POS_CLASS[head] || 'p-etc';
        const time = (get(n, d, 'start') + get(n, d, 'end')).trim();
        return `<div class="bv-row ${cls}">` +
          `<span class="bv-name">${esc(n)}</span>` +
          `<span class="bv-pos">` +
            (sub ? `<span class="p0">${esc(sub)}</span>` : '') + esc(seg[0]) +
            (seg.length > 1 ? `<span class="p2">→${esc(seg.slice(1).join('→'))}</span>` : '') +
          `</span>` +
          `<span class="bv-time">${esc(time)}</span></div>`;
      };

      h += `<div class="bv-count">出勤 ${working.length}名</div>`;
      h += '<div class="bv-list">' + (working.length ? working.map(rowFor).join('')
           : '<div class="bv-row" style="color:#64748B;justify-content:center">まだ割り当てられていません</div>') + '</div>';

      if (avail.length) {
        h += '<div class="bv-sec">この日は出られると回答（交代を頼めます）</div>';
        h += '<div class="bv-list">' + avail.map(n => {
          const sm = symOf(n, d);
          const mk = sm === 'o' ? '○' : sm === 't' ? '△' : '未';
          const col = sm === 'o' ? '#4ADE80' : sm === 't' ? '#FBBF24' : '#C4B5FD';
          return `<div class="bv-row av"><span class="bv-name">${esc(n)}</span>` +
                 `<span class="bv-pos"></span>` +
                 `<span class="bv-mark" style="color:${col}">${mk}</span></div>`;
        }).join('') + '</div>';
      }

      const cell = (k) => cells[App._safeCellKey(k)] || '';
      const offN = App.familyOffCount(cell(`fam_off_${d}`));
      h += '<div class="bv-info">';
      if (cell(`fam_off_${d}`)) h += `<div class="bv-irow fam"><span class="l">休み</span><span class="v">${esc(cell(`fam_off_${d}`))}</span></div>`;
      h += `<div class="bv-irow mkn"><span class="l">まかない</span><span class="v">${working.length + App.FAMILY.length - offN}</span></div>`;
      if (cell(`memo_${d}`)) h += `<div class="bv-irow"><span class="l">メモ</span><span class="v">${esc(cell(`memo_${d}`))}</span></div>`;
      h += '</div>';
      return h;
    }

    window.addEventListener('resize', () => fit());
    window.addEventListener('orientationchange', () => setTimeout(fit, 300));


    /* ===== 記号の見方（普段は出さない。「❔ 記号」で開く） ===== */
    const POS_FULL = {
      K: '調理場', R2: 'レストラン', R2d: 'レストラン（ドリンク）',
      R1: 'レストラン1', W: '洗い場', T: 'テイクアウト'
    };

    function buildLegend(usedPos, usedAvail, used0, used2) {
      const order = ['K', 'R2', 'R2d', 'R1', 'W', 'T'];
      let h = '';

      const posItems = order.filter(p => usedPos[p])
        .map(p => `<span class="leg-item"><i class="${usedPos[p]}">${p}</i>${POS_FULL[p] || ''}</span>`).join('');
      if (posItems) {
        h += `<div class="leg-sec"><h3>ポジション（1部 9:00〜16:00）</h3><div class="leg-items">${posItems}</div></div>`;
      }

      if (used2) {
        h += '<div class="leg-sec"><h3>2部（16時〜L）</h3>' +
             '<div class="leg-note"><b style="font-size:22px">R2</b><b style="font-size:15px;opacity:0.9">→W</b>' +
             '　のように、<b>小さい方が2部</b>のポジションです。<br>' +
             '「（」が付いている人（例: R2→（T）は <b>16:30で先に上がり</b>ます。</div></div>';
      }

      if (used0) {
        h += '<div class="leg-sec"><h3>0部（9:00〜9:30 朝の準備）</h3>' +
             '<div class="leg-note">ポジションの<b>左の小さい印</b>が0部です。</div>' +
             '<div class="leg-items" style="margin-top:8px">' +
             [['C','クリーン（廊下の掃除）'],['1F','一階の準備'],
              ['Rj','レストラン準備'],['Tj','テイクアウト準備'],['m','盛り付け']]
               .map(([k, v]) => `<span class="leg-item"><i style="background:rgba(255,255,255,0.20);color:#E2E8F0">${k}</i>${v}</span>`).join('') +
             '</div>' +
             '<div class="leg-note" style="margin-top:8px">「C・m」は 9時からC、そのあと 10時からm という意味です。</div></div>';
      }

      if (usedAvail) {
        h += '<div class="leg-sec"><h3>シフトに入っていない日</h3><div class="leg-items">' +
             '<span class="leg-item"><i style="background:#123024;color:#4ADE80">○</i>出られると回答（交代を頼めます）</span>' +
             '<span class="leg-item"><i style="background:#2E2410;color:#FBBF24">△</i>条件付きで出られる</span>' +
             '<span class="leg-item"><i style="background:#241C36;color:#C4B5FD">未</i>入れるか未定</span>' +
             '</div></div>';
      }

      h += '<div class="leg-sec"><h3>時間・その他</h3><div class="leg-note">' +
           '<b>9-L</b> … 9時からラストまで<br>' +
           '<b>930-16</b> … 9時半から16時まで<br>' +
           '<b>まかない</b> … その日のスタッフと家族の出勤人数を足した数<br>' +
           '<b>休み</b> … その日休む家族（店=店長 / 若奥（若）=若奥さん / 奥=奥さん / 会=会長）<br>' +
           '　　　　誰か分からない日は「1人」「2人」と人数だけ書いてあります' +
           '</div></div>';

      document.getElementById('leg-body').innerHTML = h;
    }

    function openLegend() { document.getElementById('leg-back').classList.add('open'); }
    function closeLegend() { document.getElementById('leg-back').classList.remove('open'); }


    // 表を画面いっぱいまで拡大／縮小する（縦横どちらも余白を残さない）
    function fit() {
      if (bvMode === 'day') return;
      const wrap = document.getElementById('fit-wrap');
      const inner = document.getElementById('fit-inner');
      if (!inner.firstElementChild) return;
      const table = inner.querySelector('table');
      const shortScreen = window.innerHeight <= 500;   // スマホ横向き
      if (table) { table.style.width = ''; table.style.height = ''; }
      inner.style.transform = 'scale(1)';
      inner.style.left = '0px';
      inner.style.marginBottom = '0px';
      inner.style.marginLeft = '0px';
      inner.style.position = shortScreen ? 'relative' : 'absolute';
      wrap.classList.toggle('scrolly', shortScreen);
      let w = inner.scrollWidth, h = inner.scrollHeight;
      if (!w || !h) return;
      const availW = wrap.clientWidth, availH = wrap.clientHeight;

      if (shortScreen) {
        // 横向きは高さが足りない。縦にも合わせると読めないので、
        // 横幅だけに合わせて縦はスクロールさせる
        const s2 = Math.min(availW / w, 1);
        inner.style.transform = `scale(${s2})`;
        inner.style.marginBottom = Math.round(h * s2 - h) + 'px';
        inner.style.marginLeft = Math.max(0, (availW - w * s2) / 2) + 'px';
        return;
      }

      let s = Math.min(availW / w, availH / h);
      // 高さで頭打ちなら、横方向の余りを列幅に配って文字をさらに大きく見せる
      if (table && availW / w > availH / h) {
        table.style.width = Math.floor(availW / s) + 'px';
        w = inner.scrollWidth; h = inner.scrollHeight;
        s = Math.min(availW / w, availH / h);
      } else if (table && availH / h > availW / w) {
        // 逆に幅で頭打ち（スマホ縦向き）なら、行の高さを伸ばして画面を使い切る
        table.style.height = Math.floor(availH / s) + 'px';
        w = inner.scrollWidth; h = inner.scrollHeight;
        s = Math.min(availW / w, availH / h);
      }
      inner.style.transform = `scale(${s})`;
      inner.style.left = Math.max(0, (availW - inner.scrollWidth * s) / 2) + 'px';
    }

    init();
  </script>
